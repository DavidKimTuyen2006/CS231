# C5 — HSV + HOG đa tỉ lệ (9.896 chiều), alpha = 0.5 + Linear SVM.

experiment:
  name: c5_hsv_mhog_svm
  description: HSV + HOG đa tỉ lệ (9.896 chiều), fusion alpha = 0.5, chuẩn hóa L2, Linear SVM
  seed: 42

representation:
  hsv: true
  hog_scales: [64, 128]
  fusion:
    alpha: 0.5
    alpha_grid: [0.1, 0.3, 0.5, 0.7, 0.9]

classifier:
  type: linear_svm
  C_grid: [0.01, 0.1, 1.0, 10.0]
  penalty: l2
  loss: squared_hinge
  max_iter: 5000
  tol: 0.0001

evaluation:
  selection_metric: macro_f1
