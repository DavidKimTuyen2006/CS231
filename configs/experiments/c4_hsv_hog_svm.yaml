# C4 — HSV + HOG-128 (8.132 chiều), alpha = 0.5 + Linear SVM.

experiment:
  name: c4_hsv_hog_svm
  description: HSV + HOG-128 (8.132 chiều), fusion alpha = 0.5, chuẩn hóa L2, Linear SVM
  seed: 42

representation:
  hsv: true
  hog_scales: [128]
  fusion:
    alpha: 0.5

classifier:
  type: linear_svm
  C_grid: [0.01, 0.1, 1.0, 10.0]
  penalty: l2
  loss: squared_hinge
  max_iter: 5000
  tol: 0.0001

evaluation:
  selection_metric: macro_f1
